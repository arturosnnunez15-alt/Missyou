<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti, Mi Amor ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2d0b1e 0%, #0d0208 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
      position: relative;
    }

    /* Background particles canvas */
    #canvas-romantic {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating petals container */
    .petals-container {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .petal {
      position: absolute;
      top: -40px;
      opacity: 0.8;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0.9;
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(25px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-25px);
        opacity: 0;
      }
    }

    /* Glassmorphism Card Styling */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 182, 193, 0.25);
      border-radius: 32px;
      padding: 45px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 105, 180, 0.1);
      text-align: center;
      max-width: 460px;
      width: 90%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardAppear 1.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: scale(0.9) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Decorative Rose Symbol */
    .rose-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 10px rgba(255, 64, 129, 0.8));
      animation: pulseRose 2.5s infinite ease-in-out;
    }

    @keyframes pulseRose {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* Poem Verses Styling */
    .poem-verse {
      color: #fff0f5;
      font-size: 1.05rem;
      line-height: 1.85;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      margin: 4px 0;
      opacity: 0;
      animation: fadeInVerse 1s ease-out forwards;
    }

    .highlight-line {
      font-family: 'Great Vibes', cursive;
      font-size: 2.4rem;
      color: #ffb3c6;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
      margin: 12px 0 8px 0;
      line-height: 1.2;
    }

    @keyframes fadeInVerse {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Romantic Canvas Animation -->
  <canvas id="canvas-romantic"></canvas>

  <!-- Petals Floating Effect -->
  <div class="petals-container" id="petals"></div>

  <!-- Romantic Glassmorphism Poem Card -->
  <div class="card">
    <div class="rose-icon">🌹</div>

    <p class="poem-verse highlight-line" style="animation-delay: 0.3s;">Te extraño</p>
    <p class="poem-verse" style="animation-delay: 0.7s;">Como se extrañan las noches sin estrellas</p>
    <p class="poem-verse" style="animation-delay: 1.1s;">Como se extrañan las mañanas bellas</p>
    <p class="poem-verse" style="animation-delay: 1.5s;">No estar contigo, por Dios que me hace daño</p>
    
    <p class="poem-verse highlight-line" style="animation-delay: 1.9s; margin-top: 18px;">Te extraño</p>
    <p class="poem-verse" style="animation-delay: 2.3s;">Cuando camino, cuando lloro, cuando río</p>
    <p class="poem-verse" style="animation-delay: 2.7s;">Cuando el Sol brilla, cuando hace mucho frío</p>
    <p class="poem-verse" style="animation-delay: 3.1s;">Porque te siento como algo muy mío</p>
  </div>

  <script>
    // --- 1. PETALS & HEARTS GENERATOR ---
    const petalsContainer = document.getElementById('petals');
    const petalSVG = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff4d6d">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    `;

    for (let i = 0; i < 22; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.innerHTML = petalSVG;
      petal.style.left = `${Math.random() * 95}%`;
      petal.style.animationDuration = `${7 + Math.random() * 6}s`;
      petal.style.animationDelay = `${Math.random() * 8}s`;
      petal.style.transform = `scale(${0.5 + Math.random() * 0.7})`;
      petalsContainer.appendChild(petal);
    }

    // --- 2. CANVAS GLOW & SPARKLE PARTICLES ---
    const canvas = document.getElementById('canvas-romantic');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class SparkleParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 2 + 0.5;
        this.color = ['#ff758f', '#ffb3c6', '#ff4d6d', '#ffffff', '#ffd166'][Math.floor(Math.random() * 5)];
        this.alpha = Math.random();
        this.speed = Math.random() * 0.015 + 0.005;
        this.growing = Math.random() > 0.5;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        if (this.growing) {
          this.alpha += this.speed;
          if (this.alpha >= 0.9) this.growing = false;
        } else {
          this.alpha -= this.speed;
          if (this.alpha <= 0.1) this.reset();
        }
      }
    }

    const sparkles = [];
    for (let i = 0; i < 65; i++) {
      sparkles.push(new SparkleParticle());
    }

    function animateSparkles() {
      requestAnimationFrame(animateSparkles);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      sparkles.forEach(sparkle => {
        sparkle.update();
        sparkle.draw();
      });
    }

    animateSparkles();
  </script>
</body>
</html>

    animate();
  </script>
</body>
</html>
