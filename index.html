<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti, Mi Amor ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f0510;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 40px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 105, 180, 0.1);
      text-align: center;
      max-width: 420px;
      width: 88%;
      z-index: 10;
      position: relative;
      animation: floatCard 6s ease-in-out infinite alternate;
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    .icon-top {
      font-size: 2rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: pulseRose 2s infinite ease-in-out;
    }

    @keyframes pulseRose {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #ff758f;
      text-shadow: 0 0 12px rgba(255, 117, 143, 0.6);
      margin-bottom: 18px;
    }

    .verse {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #f1e3e6;
      font-weight: 300;
      margin-bottom: 22px;
      letter-spacing: 0.3px;
    }

    .hearts-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .falling-heart {
      position: absolute;
      top: -20px;
      color: rgba(255, 117, 143, 0.7);
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div class="hearts-rain" id="heartsRain"></div>

  <div class="card">
    <div class="icon-top">🌹</div>
    
    <div class="title">Te extraño</div>
    
    <p class="verse">
      Como se extrañan las noches sin estrellas<br>
      Como se extrañan las mañanas bellas<br>
      No estar contigo, por Dios que me hace daño
    </p>

    <div class="title" style="font-size: 2.4rem; margin-top: 10px;">Te extraño</div>

    <p class="verse" style="margin-bottom: 0;">
      Cuando camino, cuando lloro, cuando río<br>
      Cuando el Sol brilla, cuando hace mucho frío<br>
      Porque te siento como algo muy mío
    </p>
  </div>

  <script>
    // FUEGOS / DESTELLOS DE LUZ
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.alpha = Math.random();
        this.alphaSpeed = 0.005 + Math.random() * 0.01;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha += this.alphaSpeed;

        if (this.alpha >= 1 || this.alpha <= 0) {
          this.alphaSpeed = -this.alphaSpeed;
        }

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#ffb3c1';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff4d6d';
        ctx.fill();
        ctx.restore();
      }
    }

    const particles = Array.from({ length: 60 }, () => new Particle());

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    // LLUVIA DE CORAZONES
    const heartsRain = document.getElementById('heartsRain');
    const heartIcons = ['❤️', '💖', '✨', '💕', '🌸'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'falling-heart';
      heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 12 + 10) + 'px';
      heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
      heartsRain.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 450);
  </script>
</body>
</html>
